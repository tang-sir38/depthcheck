[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "depthcheck"
version = "1.0.0"
description = "Decompose the Fano factor of normalized single-cell counts into a depth-computable term and a gene-specific term, with a pre-registered verdict."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Chaohua Tang", email = "13860904395@163.com" },
  { name = "Fangfang Wu" },
  { name = "Yingying Zheng" },
  { name = "Lingling Zhan" },
  { name = "Hong Tan" },
  { name = "Lijing Lin" },
  { name = "Meimei Wen" },
]
keywords = ["single-cell", "Fano factor", "library size", "normalization", "dispersion"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "h5py>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "hypothesis>=6"]

[project.urls]
Homepage = "https://github.com/tang-sir38/depthcheck"
Documentation = "https://github.com/tang-sir38/depthcheck/blob/main/docs/vignette.md"

[project.scripts]
depthcheck = "depthcheck.cli:main"

[tool.setuptools]
packages = ["depthcheck"]

[tool.setuptools.package-data]
depthcheck = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
markers = [
  "slow: requires the 865 MB mouse ovary H5AD and takes minutes",
]
testpaths = ["tests"]
